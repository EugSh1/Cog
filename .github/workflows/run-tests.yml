name: Run Tests

on:
    push:
        branches: ["main"]
        paths: ["src/**", "tests/**"]
    pull_request:
        branches: ["main"]
        paths: ["src/**", "tests/**"]

jobs:
    run-tests:
        runs-on: ubuntu-22.04

        steps:
            - name: Checkout
              uses: actions/checkout@v4.2.2
            - name: Setup Node.js environment
              uses: actions/setup-node@v4.4.0
              with:
                  node-version: 20
                  cache: "npm"
            - name: Install dependencies
              run: npm ci
            - name: Run tests
              run: npm run test
