name: Run Tests

on:
    push:
        branches: ["main"]
    pull_request:
        branches: ["main"]

jobs:
    test:
        runs-on: ubuntu-22.04

        steps:
            - name: Checkout
              uses: actions/checkout@v4.2.2
            - name: Setup Node.js environment
              uses: actions/setup-node@v4.4.0
              with:
                  cache: "npm"
            - run: npm ci
            - run: npm run test
